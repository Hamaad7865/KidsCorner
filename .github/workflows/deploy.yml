name: Deploy to Cloudflare Workers

# Deploys on a push to main, or on demand.
#
# Built in CI rather than on the shop laptop for two reasons. OpenNext warns
# that Windows support is not guaranteed — the build does work there today, but
# "works today" is not something to hang a shop's website on. And the Supabase
# keys are inlined at build time, so the build environment is what decides
# whether the deployed site enforces auth; a repository secret is a better place
# for that than whatever happened to be in someone's shell.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # One deploy at a time. Two overlapping `wrangler deploy` runs race to be the
  # live version, and the winner is whichever finishes last, not whichever is
  # newer.
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The checks that would otherwise be discovered by a customer. Cheap
      # enough to run every time, and a broken till is expensive.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Fails the build when the Supabase keys are absent. Without them the
      # middleware waves every request through — see scripts/preflight.mjs.
      - name: Build for Cloudflare
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run cf:build

      # Apply any migration not yet run against the live database, BEFORE the
      # code that expects it goes out — so the schema can never lag the deploy
      # (the failure that showed every page "migration 001 not applied"). Runs
      # after the build so a broken build never migrates; if it fails, the
      # Deploy step below does not run. Inactive until the SUPABASE_DB_URL
      # secret is set: without it the script warns and exits 0 rather than
      # breaking the deploy. See scripts/migrate.mjs.
      - name: Apply database migrations
        env:
          # Accept either spelling of the secret — the local .env key is
          # SUPABASE_DB_UR (no trailing L), so the secret may be named to match
          # it. migrate.mjs reads whichever is set.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_UR: ${{ secrets.SUPABASE_DB_UR }}
        run: node scripts/migrate.mjs

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
