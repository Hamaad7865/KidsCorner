name = "kidscorner"
main = ".open-next/worker.js"

# Must be 2024-09-23 or later for the OpenNext adapter. Set to a real past
# date — a compatibility date in the future is rejected.
compatibility_date = "2026-07-30"

# `nodejs_compat` is required. This app needs it for one thing specifically:
# `lib/pos/pin.ts` uses `Buffer` to pack the PBKDF2 salt and hash into a single
# column. Without the flag every cashier PIN check fails at the till.
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true

# NOTE ON SECRETS — read before deploying.
#
# `NEXT_PUBLIC_SUPABASE_URL` and `NEXT_PUBLIC_SUPABASE_ANON_KEY` are NOT set
# here, and must not be. Anything prefixed `NEXT_PUBLIC_` is inlined by Next at
# BUILD time, not read at runtime, so a value set on the Worker arrives too
# late — the bundle already contains whatever was present when it was built.
#
# They belong in the build environment instead: GitHub repository secrets, read
# by the workflow in .github/workflows/deploy.yml. If a deployed page cannot
# reach Supabase, that is the first thing to check.
#
# A genuinely server-only secret WOULD go here, via
# `npx wrangler secret put NAME` — there are none in this app today.
